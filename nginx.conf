server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # our own files only; the state of the projects comes from GitHub's API
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ /\. { return 404; }
    location / { index index.html; try_files $uri $uri/ =404; }
    location ~* \.(webp|svg|css|js)$ { expires 7d; }
}
